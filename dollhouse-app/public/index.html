<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dollhouse — Design Your Life. Delivered.</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" data-nav="pitch">
        <span class="brand-icon">🏠</span>
        <span class="brand-name">Dollhouse</span>
      </div>
      <nav class="tabs" id="mainNav">
        <button data-nav="pitch">Pitch</button>
        <button data-nav="quiz">Style Quiz</button>
        <button data-nav="marketplace">Marketplace</button>
        <button data-nav="boards">Boards</button>
        <button data-nav="designers">Designers</button>
        <button data-nav="vip">VIP Box</button>
        <button data-nav="dashboard">Investor Dashboard</button>
      </nav>
      <div class="topbar-right">
        <button class="cart-btn" data-nav="cart">
          🛍️ Cart <span id="cartCount" class="cart-count">0</span>
        </button>
        <button class="profile-btn" data-nav="profile" id="profileBtn">👤 <span id="profileName">Guest</span></button>
      </div>
    </header>

    <main id="viewRoot" class="view-root"></main>

    <footer class="footer">
      <p>💡 Dollhouse: Design Your Life. Delivered. — investor-pitch demo, all data is illustrative.</p>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
