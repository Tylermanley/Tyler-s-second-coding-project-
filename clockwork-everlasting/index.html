<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clockwork Everlasting</title>
  <meta name="theme-color" content="#2f5d3a">
  <meta name="description" content="A cozy time-travel farming, puzzle and anime card-battle game.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">⏳ Clockwork Everlasting</h1>
    <div class="hud" id="hud"></div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="farm">🌱 Homestead</button>
    <button class="tab" data-tab="portal">🌀 Time Portal</button>
    <button class="tab" data-tab="town">💞 Companions</button>
    <button class="tab" data-tab="museum">🏛️ Museum</button>
    <button class="tab" data-tab="market">🛒 Market</button>
    <button class="tab" data-tab="help">❔ Help</button>
    <button class="tab" data-tab="settings">⚙️ Settings</button>
  </nav>

  <main>
    <section class="view active" id="view-farm"></section>
    <section class="view" id="view-portal"></section>
    <section class="view" id="view-town"></section>
    <section class="view" id="view-museum"></section>
    <section class="view" id="view-market"></section>
    <section class="view" id="view-help"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <div class="stage" id="stage"><div class="stage-inner" id="stageInner"></div></div>
  <div class="dialogue" id="dialogue"></div>
  <div class="toasts" id="toasts"></div>

  <script src="js/data.js"></script>
  <script src="js/chesspuzzles.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/state.js"></script>
  <script src="js/portraits.js"></script>
  <script src="js/puzzles.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/companions.js"></script>
  <script src="js/villains.js"></script>
  <script src="js/mentors.js"></script>
  <script src="js/festivals.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/cooking.js"></script>
  <script src="js/homestead2.js"></script>
  <script src="js/rift.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/farm.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
